[project]
name = "finrag-indic"
version = "0.1.0"
description = "Research-grade multilingual financial literacy assistant for Indian users"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "streamlit>=1.42,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag_indic"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: tests spanning multiple application components",
    "live: tests requiring external services or credentials",
]

[tool.coverage.run]
source = ["finrag_indic"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

