[project]
name = "finrag-indic"
version = "0.1.0"
description = "Research-grade multilingual financial literacy assistant for Indian users"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "faiss-cpu>=1.13,<2",
    "fastapi>=0.115,<1",
    "fonttools>=4.60,<5",
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "openai>=2.7,<3",
    "psutil>=7.1,<8",
    "pyarrow>=26,<27",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.26,<2",
    "sentence-transformers>=5.1,<6",
    "streamlit>=1.42,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag_indic"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: tests spanning multiple application components",
    "live: tests requiring external services or credentials",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["finrag_indic"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

